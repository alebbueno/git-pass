name: build-gate

on:
  push:
    branches: [main]
    paths:
      - "gitpass-desktop/**"
      - "crates/**"
      - "scripts/verify-app-build.sh"
      - "scripts/build-sidecars.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "gitpass-desktop/**"
      - "crates/**"
      - "scripts/verify-app-build.sh"
      - "scripts/build-sidecars.mjs"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gitpass-desktop/package-lock.json
      - run: npm ci
        working-directory: gitpass-desktop
      - uses: dtolnay/rust-toolchain@stable
      - run: chmod +x scripts/verify-app-build.sh
      - name: Verify app build
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-build-gate
        run: ./scripts/verify-app-build.sh
