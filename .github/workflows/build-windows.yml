name: build-windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publicar o instalador NSIS num GitHub Release
        type: boolean
        default: false
      release_tag:
        description: "Tag do release (opcional; padrão v<versão>-windows-<nº da run>)"
        type: string
        required: false
  pull_request:
    paths:
      - "gitpass-desktop/**"
      - "crates/**"
      - "scripts/verify-app-build.ps1"
      - ".github/workflows/build-windows.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "gitpass-desktop/**"
      - "crates/**"
      - "scripts/verify-app-build.ps1"
      - ".github/workflows/build-windows.yml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      installer_name: ${{ steps.installer.outputs.name }}
      app_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gitpass-desktop/package-lock.json
      - run: npm ci
        working-directory: gitpass-desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: App version (tauri.conf.json)
        id: version
        shell: pwsh
        run: |
          $conf = Get-Content gitpass-desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          "version=$($conf.version)" >> $env:GITHUB_OUTPUT
      - name: Verify app build (Windows)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-windows
        shell: pwsh
        run: ./scripts/verify-app-build.ps1
      - name: Locate NSIS installer
        id: installer
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE "target/ci-windows/release/bundle/nsis"
          $exe = Get-ChildItem $dir -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found under $dir" }
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: gitpass-windows-x64
          path: target/ci-windows/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: gitpass-windows-x64
          path: dist/windows
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ needs.smoke.outputs.app_version }}-windows-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: GitPass ${{ needs.smoke.outputs.app_version }} (Windows x64)
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          generate_release_notes: true
          files: dist/windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
