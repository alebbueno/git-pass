<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>GitPass · Splash Rota</title>
<style>
  :root {
    color-scheme: light;
    --ink: #18192e;
    --muted: #565c74;
    --dim: #646b84;
    --canvas: #f4f5fb;
    --surface: #fcfcff;
    --inset: #eff0f8;
    --line: #dce0ed;
    --soft-line: #e7e9f3;
    --accent: #5138c9;
    --accent-on: #fff;
    --accent-soft: #eeeafd;
    --accent-line: #d9cffb;
    --sidebar: #eef0f9e8;
    --bar: #f9faffdb;
    --highlight: #fffdfd;
    --primary-fill: linear-gradient(122deg, #6649dc, #4a34bd 72%, #4b49be);
    --surface-sheen: linear-gradient(145deg, #fff, #fafaff 62%);
    --good: #146347;
    --good-bg: #e2f6ec;
    --warn: #865415;
    --warn-bg: #fff0d7;
    --iris: #5535b3;
    --iris-bg: #eee9fd;
    --aqua: #126477;
    --aqua-bg: #e1f4f8;
    --rose: #9b3b64;
    --rose-bg: #f9e6ee;
    --outer: #e1e4f4;
    --outer-light: #f1e8ff;
    --outer-cool: #d0e9f1;
    --shadow: 0 1px 3px #2721490a, 0 22px 64px #2d265424, 0 4px 14px #30275014;
    --float-shadow: 0 24px 85px #18122a50, 0 5px 18px #19132926;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --ease: cubic-bezier(.2,.78,.2,1);
    --sheet-ease: cubic-bezier(.22,.79,.23,1);
    --sheet-time: .46s;
    --frame-gap: 26px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink: #f1f2ff;
    --muted: #b7bdd6;
    --dim: #9ca5c5;
    --canvas: #0e1120;
    --surface: #161a2d;
    --inset: #111526;
    --line: #2d3550;
    --soft-line: #242b43;
    --accent: #beb0ff;
    --accent-on: #17142b;
    --accent-soft: #252342;
    --accent-line: #554979;
    --sidebar: #141729f4;
    --bar: #101426e4;
    --highlight: #b2bdff18;
    --primary-fill: linear-gradient(120deg, #ab96ff, #c6b7ff 56%, #a4dbf5);
    --surface-sheen: linear-gradient(145deg, #1a1d32, #15192c 62%);
    --good: #9be7c7;
    --good-bg: #193a36;
    --warn: #ffcf8e;
    --warn-bg: #3e2d27;
    --iris: #d4c3ff;
    --iris-bg: #392d56;
    --aqua: #a0e4eb;
    --aqua-bg: #1e3a47;
    --rose: #fac0d9;
    --rose-bg: #492c41;
    --outer: #0a0c19;
    --outer-light: #2b2150;
    --outer-cool: #143243;
    --shadow: 0 1px 2px #0707104d, 0 24px 68px #06060d80;
    --float-shadow: 0 26px 90px #06060dbd, 0 5px 24px #08080d70;
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    padding: var(--frame-gap);
    display: grid;
    place-items: center;
    color: var(--ink);
    background: radial-gradient(ellipse at 11% 9%, var(--outer-light), transparent 53%),
      radial-gradient(ellipse at 89% 80%, var(--outer-cool), transparent 50%), var(--outer);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; }
  button { cursor: pointer; color: inherit; }
  button:disabled { cursor: default; opacity: .65; }
  button, a, input, select { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; }
  code, .mono { font-family: var(--mono); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .ico { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: middle; }
  .truncate { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .muted { color: var(--muted); }
  .caption { font-size: 12px; }
  .eyebrow {
    color: var(--dim); font-size: 10px; font-weight: 720;
    letter-spacing: .115em; text-transform: uppercase;
  }
  .app {
    --rail-width: 223px;
    position: relative;
    isolation: isolate;
    width: min(100%, 1440px);
    height: calc(100svh - var(--frame-gap) * 2);
    min-height: 550px;
    display: grid;
    grid-template-columns: var(--rail-width) minmax(0, 1fr);
    border: 1px solid color-mix(in srgb, var(--line) 70%, var(--accent-line));
    border-radius: 23px;
    overflow: hidden;
    background: var(--canvas);
    box-shadow: var(--shadow);
  }
  .rail {
    position: relative;
    z-index: 3;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: auto;
    scrollbar-width: thin;
    padding: 0 13px 13px;
    border-right: 1px solid var(--line);
    background: radial-gradient(ellipse at 20% 8%, color-mix(in srgb, var(--accent-line) 38%, transparent), transparent 42%),
      radial-gradient(ellipse at 0% 95%, color-mix(in srgb, var(--aqua-bg) 38%, transparent), transparent 37%), var(--sidebar);
    -webkit-backdrop-filter: blur(22px);
    backdrop-filter: blur(22px);
  }
  .traffic {
    height: 51px;
    min-height: 51px;
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: 10px;
  }
  .traffic span { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 -1px 1px #37223119; }
  .traffic span:nth-child(1) { background: #f57371; }
  .traffic span:nth-child(2) { background: #efbd58; }
  .traffic span:nth-child(3) { background: #58bf84; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 5px 7px 31px; min-width: 0; }
  .brand-icon {
    display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 42px; color: #fff;
    border-radius: 13px; border: 1px solid #b0a1fb83;
    background: radial-gradient(ellipse at 0% 0%, #d8bbff, transparent 57%),
      radial-gradient(ellipse at 100% 100%, #3f92bd, transparent 56%), linear-gradient(140deg, #6d51df, #29225e);
    box-shadow: inset 0 1px 1px #f1eaff8f, inset 0 -1px 3px #22204e95, 0 5px 17px #6654b45e;
  }
  .brand-icon .ico { width: 26px; height: 26px; }
  .brand-name { font-size: 21px; font-weight: 780; letter-spacing: -.055em; line-height: 1.1; }
  .brand-note { margin-top: 3px; color: var(--muted); font-size: 11px; }
  .rail .eyebrow { margin: 0 8px 8px; }
  .nav { display: grid; gap: 3px; }
  .nav-item, .rail-profile {
    width: 100%; display: flex; align-items: center; gap: 10px; min-height: 38px;
    padding: 0 9px; border: 1px solid transparent; border-radius: 10px;
    text-align: left; background: transparent; font-size: 13px;
    transition: background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
  }
  .nav-item .ico { width: 17px; height: 17px; color: var(--muted); }
  .nav-item:hover, .rail-profile:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .nav-item[aria-current="page"] {
    color: var(--ink); font-weight: 700; border-color: var(--accent-line);
    background: linear-gradient(100deg, var(--accent-soft), var(--surface));
    box-shadow: inset 0 1px var(--highlight), 0 2px 7px #15162d14;
  }
  .nav-item[aria-current="page"] .ico { color: var(--accent); }
  .nav-count {
    margin-left: auto; min-width: 21px; padding: 1px 5px; border: 1px solid var(--line); border-radius: 5px;
    color: var(--muted); text-align: center; font: 10px/1.5 var(--mono);
  }
  .rail-profiles { margin-top: 29px; }
  .rail-profile { min-height: 34px; gap: 8px; }
  .rail-profile .avatar { --size: 22px; font-size: 9px; }
  .rail-foot { padding-top: 20px; margin-top: auto; }
  .rail-integration {
    display: flex; align-items: center; gap: 9px; width: 100%; min-height: 46px; text-align: left;
    padding: 8px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface);
    transition: border-color .18s var(--ease), background .18s var(--ease);
  }
  .rail-integration:hover { border-color: var(--accent-line); background: var(--inset); }
  .integration-icon {
    display: grid; place-items: center; width: 25px; height: 25px; flex-shrink: 0;
    border-radius: 8px; color: var(--good); background: var(--good-bg);
  }
  .rail-integration strong { display: block; font-size: 11px; font-weight: 700; }
  .rail-integration small { display: block; font-size: 10px; color: var(--muted); }
  .rail-integration > .ico { margin-left: auto; width: 13px; color: var(--dim); }
  .workspace {
    min-width: 0; min-height: 0; display: grid; grid-template-rows: 51px minmax(0,1fr);
    background: radial-gradient(ellipse at 80% 0%, color-mix(in srgb, var(--accent-soft) 62%, transparent), transparent 57%);
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-width: 0; padding: 0 25px; border-bottom: 1px solid var(--line); background: var(--bar);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  }
  .crumbs, .top-actions { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .crumbs { color: var(--muted); font-size: 12px; }
  .crumbs strong { color: var(--ink); font-weight: 660; }
  .crumbs .ico { width: 13px; height: 13px; }
  .preview-label {
    color: var(--muted); font-size: 11px; white-space: nowrap; background: var(--inset);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px;
  }
  .screen { min-width: 0; min-height: 0; overflow: auto; scrollbar-width: thin; padding: 0 28px 28px; container-type: inline-size; }
  .screen:focus { outline: none; }
  .screen-inner { max-width: 1120px; margin-inline: auto; animation: arrive .2s var(--ease); }
  .page-head {
    display: flex; justify-content: space-between; align-items: end; gap: 18px;
    padding: 30px 0 22px;
  }
  .heading-group { min-width: 0; }
  .heading-group h1 { font-size: clamp(28px,3.6vw,46px); line-height: 1.04; letter-spacing: -.065em; font-weight: 760; }
  .heading-group p { margin-top: 7px; font-size: 13px; color: var(--muted); }
  .control, .icon-button {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-height: 35px; padding: 0 11px; color: var(--ink); white-space: nowrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
    font-size: 12px; font-weight: 640; text-decoration: none;
    transition: background .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease), filter .18s var(--ease);
  }
  .control .ico { width: 15px; height: 15px; }
  .control:hover, .icon-button:hover { border-color: var(--accent-line); background: var(--inset); }
  .control:active, .icon-button:active { transform: translateY(1px) scale(.985); }
  .control.primary {
    min-height: 38px; padding: 0 13px; background: var(--primary-fill); color: var(--accent-on); border-color: transparent;
    box-shadow: inset 0 1px 0 #ffffff50, inset 0 -1px 0 #20164d3b, 0 4px 13px color-mix(in srgb, var(--accent) 26%, transparent);
  }
  .control.primary:hover {
    background: var(--primary-fill); filter: brightness(1.09);
    box-shadow: inset 0 1px 0 #ffffff6b, 0 5px 17px color-mix(in srgb, var(--accent) 37%, transparent);
  }
  .control.ghost, .icon-button.ghost { background: transparent; border-color: transparent; box-shadow: none; }
  .control.ghost:hover, .icon-button.ghost:hover { background: var(--inset); border-color: var(--line); }
  .icon-button { width: 33px; height: 33px; min-height: 33px; padding: 0; color: var(--muted); }
  .icon-button .ico { width: 15px; height: 15px; }
  .filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 13px; }
  .search {
    display: flex; align-items: center; gap: 8px; width: min(100%, 363px); min-height: 36px;
    padding: 0 9px; color: var(--dim); background: var(--surface); border: 1px solid var(--line);
    border-radius: 9px; transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search input {
    width: 100%; min-width: 0; outline: none; border: 0; background: transparent; color: var(--ink);
    padding: 7px 0; font-size: 12.5px;
  }
  .search input::placeholder { color: var(--dim); }
  kbd {
    display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center;
    min-width: 26px; padding: 1px 4px; font: 10px var(--mono); white-space: nowrap;
    border: 1px solid var(--line); border-radius: 5px; background: var(--inset); color: var(--muted);
  }
  .select-wrap { display: inline-flex; position: relative; min-width: 152px; max-width: 100%; color: var(--muted); }
  .select-wrap > .ico { position: absolute; left: 9px; top: 10px; pointer-events: none; }
  select {
    min-height: 36px; padding: 0 10px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 9px; font-size: 12px; cursor: pointer;
  }
  .select-wrap select { width: 100%; padding-left: 32px; }
  .filter-review[aria-pressed="true"] { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
  .filter-count { margin-left: auto; padding-left: 4px; white-space: nowrap; color: var(--muted); font-size: 12px; }
  .list-frame {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 6px 23px #171a360d; overflow: hidden;
  }
  .columns, .project-row {
    display: grid; grid-template-columns: minmax(160px, 2.08fr) minmax(130px, 1.28fr) minmax(90px, .85fr) minmax(100px, .8fr) 18px;
    gap: 12px; align-items: center; padding-inline: 16px;
  }
  .columns {
    min-height: 37px; background: var(--surface-sheen); border-bottom: 1px solid var(--line);
    color: var(--dim); font: 10px var(--mono); letter-spacing: .075em; text-transform: uppercase;
  }
  .projects { padding: 0; margin: 0; list-style: none; }
  .projects li + li { border-top: 1px solid var(--soft-line); }
  .project-row {
    width: 100%; min-height: 60px; text-align: left; background: var(--surface); border: 0;
    transition: background .18s var(--ease), box-shadow .18s var(--ease);
  }
  .project-row:hover {
    background: color-mix(in srgb, var(--profile-bg) 34%, var(--surface));
    box-shadow: inset 2px 0 color-mix(in srgb, var(--profile) 60%, transparent);
  }
  .project-row[aria-expanded="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
  .project-row:focus-visible { outline-offset: -3px; border-radius: 7px; }
  .project-row:active { background: var(--accent-soft); }
  .project-name, .project-profile, .project-branch, .project-status { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .repo-mark {
    display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 34px;
    background: linear-gradient(142deg, var(--profile-bg, var(--accent-soft)), var(--inset));
    color: var(--profile, var(--accent)); border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--profile, var(--accent)) 21%, var(--line));
    box-shadow: inset 0 1px var(--highlight);
    transition: transform .22s var(--ease), box-shadow .22s var(--ease);
  }
  .project-row:hover .repo-mark { transform: translateY(-2px); box-shadow: 0 4px 13px var(--profile-bg); }
  .repo-mark .ico { width: 17px; height: 17px; }
  .project-name strong, .project-name code { display: block; }
  .project-name strong { font-size: 13px; font-weight: 720; line-height: 1.3; }
  .project-name code { color: var(--muted); font-size: 10.5px; margin-top: 3px; }
  .project-branch { color: var(--muted); gap: 5px; font: 11px/1.4 var(--mono); }
  .project-branch .ico { width: 13px; height: 13px; }
  .project-chevron { color: var(--dim); transition: transform .18s var(--ease), color .18s var(--ease); }
  .project-row:hover .project-chevron { color: var(--accent); transform: translateX(2px); }
  .project-profile .pill { max-width: 100%; }
  .iris { --profile: var(--iris); --profile-bg: var(--iris-bg); --signal: #bbabff; }
  .aqua { --profile: var(--aqua); --profile-bg: var(--aqua-bg); --signal: #8fe9e1; }
  .rose { --profile: var(--rose); --profile-bg: var(--rose-bg); --signal: #ffadd3; }
  .avatar {
    --size: 31px;
    display: grid; place-items: center; width: var(--size); height: var(--size); flex: 0 0 var(--size);
    border-radius: calc(var(--size) * .32); color: var(--profile); background: var(--profile-bg);
    font-size: 11px; font-weight: 780; letter-spacing: -.02em;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 4px; min-width: 0;
    border-radius: 7px; background: var(--profile-bg); color: var(--profile); font-size: 11px; font-weight: 670;
  }
  .pill .avatar {
    --size: 16px; font-size: 7px; background: color-mix(in srgb, var(--profile) 14%, var(--profile-bg));
  }
  .state {
    display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 3px 7px; border-radius: 6px;
    color: var(--good); background: var(--good-bg); font-size: 10.5px; font-weight: 680; white-space: nowrap;
  }
  .state .ico { width: 12px; height: 12px; }
  .state.warning { color: var(--warn); background: var(--warn-bg); }
  .state.neutral { color: var(--muted); background: var(--inset); }
  .project-status .state:not(.warning) { background: transparent; }
  .list-note {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 0 0; color: var(--muted); font-size: 11.5px;
  }
  .list-note .ico { width: 13px; margin-right: 4px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); margin-bottom: 4px; }
  .surface { padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-sheen); box-shadow: inset 0 1px var(--highlight), 0 4px 15px #10152910; }
  .section-title { margin-bottom: 11px; font-size: 15px; font-weight: 720; letter-spacing: -.015em; }
  .stats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { display: grid; gap: 8px; min-height: 119px; }
  .stat-label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
  .stat-label .ico { color: var(--accent); }
  .stat-value { font-size: 26px; line-height: 1.1; font-weight: 750; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
  .stat-hint { font-size: 11px; color: var(--muted); }
  .home-attention {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 19px; padding: 12px 14px;
    background: var(--warn-bg); color: var(--warn); border-radius: 11px; font-size: 12px;
  }
  .home-attention > span { flex: 1; min-width: 150px; }
  .accounts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
  .account-card { min-width: 0; display: flex; flex-direction: column; gap: 15px; }
  .account-card .state { align-self: start; }
  .account-top { display: flex; align-items: center; gap: 10px; }
  .account-top .avatar { --size: 42px; font-size: 14px; }
  .account-top h2 { font-size: 15px; font-weight: 720; }
  .account-top .muted { font-size: 11px; }
  .account-email {
    padding: 10px; background: var(--inset); border: 1px solid var(--soft-line); border-radius: 9px;
    overflow-wrap: anywhere; min-height: 73px;
  }
  .account-email code { display: block; margin-top: 5px; font-size: 11px; }
  .account-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: auto; }
  .settings { display: grid; gap: 12px; max-width: 760px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .settings-row + .settings-row { margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--soft-line); }
  .theme-options { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--inset); }
  .theme-options .control { border-color: transparent; background: transparent; }
  .theme-options .control[aria-pressed="true"] { border-color: var(--line); background: var(--surface); color: var(--accent); }
  .cloud-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; min-height: 58px; }
  .cloud-row .project-name { flex: 1; }
  .cloud-row .state { margin-left: auto; }
  .cloud-row + .cloud-row { border-top: 1px solid var(--soft-line); }
  .drawer {
    position: absolute; inset: 0 0 0 var(--rail-width); z-index: 2; min-width: 0;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    overflow: hidden; background: var(--canvas);
    box-shadow: -24px 0 60px #0608194d, -1px 0 var(--accent-line);
    transform: translate3d(100%, 0, 0); visibility: hidden;
    transition: transform var(--sheet-time) var(--sheet-ease), visibility 0s linear var(--sheet-time);

    { name: "forma-web", owner: "marina-dev", dir: "Pessoal", profile: "personal", branch: "main" },

  ];

  const app = document.querySelector("#gitpass");

  const getProfile = (id) => profiles.find((profile) => profile.id === id);

  const repoPath = (repo) => `/Users/demo/Projetos/${repo.dir}/${repo.name}`;
  const remote = (repo) => `github.com/${repo.owner}/${repo.name}`;
  const projectCount = (count) => `${count} ${count === 1 ? "repositório" : "repositórios"}`;
  const normalize = (text) => text.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();

  function avatar(profile) {
    return `<span class="avatar ${profile.color}" aria-hidden="true">${profile.initials}</span>`;
  }

  function pill(profile) {
    return `<span class="pill ${profile.color}">${avatar(profile)}<span class="truncate">${profile.name}</span></span>`;
  }

  function badge(label, glyph, tone = "") {
    return `<span class="state ${tone}">${icon(glyph)}${label}</span>`;
  }

  function repoStatus(repo, full = false) {
    return needsReview(repo)
      ? badge(full ? "Identidade divergente" : "Revisar", "alert", "warning")
      : badge(full ? "Identidade correta" : "Correta", "check");
  }

  function profileOptions(selected, all = false) {
    const options = profiles.map((profile) =>
      `<option value="${profile.id}" ${profile.id === selected ? "selected" : ""}>${profile.name}</option>`
    );
    return (all ? '<option value="">Todos os perfis</option>' : "") + options.join("");
  }

  function heading(title, subtitle, action = "") {
    return `<div class="page-head"><div class="heading-group"><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`;
  }

  function action(label, glyph, name, variant = "") {
    return `<button type="button" class="control ${variant}" data-action="${name}">${icon(glyph)}${label}</button>`;
  }

  function repoList(list) {
    if (!list.length) {
      return '<div class="list-frame empty"><strong>Nenhum repositório encontrado</strong>Experimente outra busca ou ajuste os filtros.</div>';
    }
    return `<div class="list-frame">
      <div class="columns" aria-hidden="true"><span>Repositório local</span><span>Conta vinculada</span><span class="col-branch">Branch</span><span class="col-status">Identidade</span><span></span></div>
      <ul class="projects" aria-label="Repositórios locais">${list.map((repo) => `
        <li><button type="button" class="project-row ${getProfile(repo.profile).color}" data-repo="${repo.name}" aria-controls="repo-drawer" aria-expanded="${repo === activeRepo}">
          <span class="project-name"><span class="repo-mark">${icon("repo")}</span><span class="truncate"><strong class="truncate">${repo.name}</strong><code class="truncate">~/Projetos/${repo.dir}/${repo.name}</code></span></span>
          <span class="project-profile">${pill(getProfile(repo.profile))}</span>
          <span class="project-branch">${icon("branch")}<span class="truncate">${repo.branch}</span></span>
          <span class="project-status">${repoStatus(repo)}</span>
          <span class="project-chevron">${icon("chevron")}</span>
        </button></li>`).join("")}</ul>
    </div>`;
  }

  function updateRepoList() {
    const query = normalize(filters.text.trim());
    const list = repos.filter((repo) => {
      const profile = getProfile(repo.profile);
      const searchText = normalize([repoPath(repo), remote(repo), repo.branch, profile.name, profile.handle].join(" "));
      return searchText.includes(query) && (!filters.profile || repo.profile === filters.profile) &&
        (!filters.review || needsReview(repo));
    });
    document.querySelector("#repo-list").innerHTML = repoList(list);
    document.querySelector("#repo-count").textContent = projectCount(list.length);
  }

    return `${heading("Repositórios", "Gerencie a conta Git vinculada a cada projeto local.", action("Vincular repositório", "plus", "link-demo", "primary"))}

    return `${heading("Painel", "Acompanhe as contas e as identidades dos seus projetos.")}

      ${review ? `<div class="home-attention">${icon("alert")}<span>Um projeto está com a identidade local diferente da conta vinculada.</span>${action("Revisar identidade", "chevron", "go-review")}</div>` : ""}

      ${repoList(repos.slice(0, 4))}`;
  }

  function renderPage(focus = false) {
    navigation.innerHTML = sections.map((item) => `
      <button type="button" class="nav-item" data-page="${item.id}" aria-label="${item.name}" title="${item.name}" ${section === item.id ? 'aria-current="page"' : ""}>
        ${icon(item.icon)}<span>${item.name}</span>${item.count ? `<span class="nav-count">${item.count}</span>` : ""}
      </button>`).join("");
    document.querySelector("#crumb-page").textContent = sections.find((item) => item.id === section).name;
    screen.innerHTML = `<div class="screen-inner">${pages[section]()}</div>`;
    screen.scrollTop = 0;
    if (section === "repos") {
      document.querySelector("#repo-search").value = filters.text;
      document.querySelector("#search-key").textContent = /Mac/.test(navigator.platform) ? "⌘ K" : "Ctrl K";
      updateRepoList();
    }
    if (focus) screen.focus({ preventScroll: true });
  }

  function navigate(page) {
    closeDrawer(false);
    section = page;
    renderPage(true);
  }

  function applyTheme() {
    const dark = theme === "dark" || (theme === "auto" && systemDark.matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    const label = dark ? "Ativar tema claro" : "Ativar tema escuro";
    for (const button of [themeToggle, ...drawerHead.querySelectorAll('[data-action="toggle-theme"]')]) {
      button.innerHTML = icon(dark ? "sun" : "moon");
      button.setAttribute("aria-label", label);
      button.title = label;
    }
    document.querySelectorAll("[data-theme-choice]").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.themeChoice === theme));
    });
  }

  function toggleTheme() {
    theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    applyTheme();
  }

  document.querySelector("#brand-icon").innerHTML = icon("logo");
  document.querySelector("#crumb-arrow").innerHTML = icon("chevron");
  document.querySelector("#rail-profiles").innerHTML = profiles.map((profile) =>
    `<button type="button" class="rail-profile" data-profile-filter="${profile.id}" title="Ver projetos de ${profile.name}">${avatar(profile)}<span class="truncate">${profile.name}</span></button>`
  ).join("");
  document.querySelector("#rail-foot").innerHTML = `<button type="button" class="rail-integration" data-page="settings" aria-label="Configurações da integração com o Git" title="Integração com o Git"><span class="integration-icon">${icon("shield")}</span><span><strong>Integração ativa</strong><small>Git local</small></span>${icon("chevron")}</button>`;

  renderPage();
  applyTheme();
  systemDark.addEventListener("change", applyTheme);

  function iconButton(label, glyph, name) {
    return `<button type="button" class="icon-button ghost" data-action="${name}" aria-label="${label}" title="${label}">${icon(glyph)}</button>`;
  }

  function metaField(label, value, glyph, copy) {
    return `<div class="meta-field">${icon(glyph)}<div><div class="meta-label">${label}</div><code>${value}</code></div>
      ${copy ? iconButton(`Copiar ${label.toLowerCase()}`, "copy", copy) : ""}</div>`;
  }


  function routeArt(profile) {
    const path = "M74 152h58c42 0 41-46 86-46h85c39 0 44-43 86-43h41";
    return `<svg class="route-art" viewBox="0 0 520 220" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="route-aura">
          <stop stop-color="currentColor" stop-opacity=".25"/>
          <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="route-ink">
          <stop stop-color="#b69dff"/>
          <stop offset=".53" stop-color="currentColor"/>
          <stop offset="1" stop-color="#a2baff"/>
        </linearGradient>
        <linearGradient id="route-glass" x1="0" y1="0" x2=".8" y2="1">
          <stop stop-color="#33395f"/>
          <stop offset=".51" stop-color="#252a49"/>
          <stop offset="1" stop-color="#151c32"/>
        </linearGradient>
        <linearGradient id="route-facet" x1="0" y1="0" x2=".85" y2="1">
          <stop stop-color="#e4eaff" stop-opacity=".36"/>
          <stop offset=".56" stop-color="currentColor" stop-opacity=".12"/>
          <stop offset="1" stop-color="#1b2545" stop-opacity=".3"/>
        </linearGradient>
      </defs>
      <ellipse cx="257" cy="109" rx="210" ry="101" fill="url(#route-aura)"/>
      <g fill="none" stroke="#dce2ff" stroke-opacity=".19">
        <ellipse cx="263" cy="110" rx="211" ry="60" transform="rotate(-17 263 110)"/>
        <ellipse cx="263" cy="110" rx="224" ry="73" transform="rotate(-17 263 110)" stroke-dasharray="2 7"/>
        <path d="M17 169 503 43M91 211l361-99" stroke-opacity=".14"/>
      </g>
      <g fill="#ced7ff" opacity=".55">
        <circle cx="29" cy="95" r="1.2"/><circle cx="151" cy="55" r="1.2"/><circle cx="169" cy="177" r="1.5"/>
        <circle cx="333" cy="33" r="1.5"/><circle cx="470" cy="130" r="1.3"/><circle cx="390" cy="151" r="1.4"/>
      </g>
      <path d="${path}" fill="none" stroke="url(#route-ink)" stroke-width="8" stroke-opacity=".13"/>
      <path d="${path}" fill="none" stroke="url(#route-ink)" stroke-width="1.55" stroke-opacity=".79"/>
      <path class="signal-streak" d="${path}" pathLength="1" fill="none" stroke="#ecfcff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="134" cy="152" r="3" fill="#cbb4ff"/><circle cx="359" cy="79" r="3" fill="currentColor"/>
      <g transform="translate(74 152)">
        <rect x="-26" y="-23" width="54" height="54" rx="15" fill="#11162f" stroke="#a992fd" stroke-opacity=".3"/>
        <rect x="-27" y="-27" width="54" height="54" rx="15" fill="url(#route-glass)" stroke="#c2a9ff" stroke-opacity=".83"/>
        <path d="M-17-22h29q9 0 10 9" fill="none" stroke="#eee0ff" stroke-opacity=".44"/>
        <svg x="-13" y="-13" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d7c7ff" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">${icons.repo}</svg>
        <text class="art-label" text-anchor="middle" x="0" y="46">PROJETO</text>
      </g>
      <g transform="translate(257 106)">
        <circle r="54" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="2 5"/>
        <circle r="46" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".31"/>
        <rect x="-35" y="-29" width="72" height="72" rx="22" fill="#0c172e" stroke="currentColor" stroke-opacity=".37"/>
        <rect x="-36" y="-36" width="72" height="72" rx="22" fill="url(#route-glass)" stroke="currentColor"/>
        <rect x="-35" y="-35" width="70" height="70" rx="21" fill="url(#route-facet)"/>
        <path d="M-23-29h34q16 0 18 15M-23 30h34" fill="none" stroke="#e7fffa" stroke-opacity=".53"/>
        <text class="art-initials" text-anchor="middle" x="0" y="7">${profile.initials}</text>
        <text class="art-label" text-anchor="middle" x="0" y="72">CONTA</text>
      </g>
      <g transform="translate(430 63)">
        <rect x="-26" y="-23" width="54" height="54" rx="15" fill="#10152c" stroke="#96b6ff" stroke-opacity=".3"/>
        <rect x="-27" y="-27" width="54" height="54" rx="15" fill="url(#route-glass)" stroke="#a6c0ff" stroke-opacity=".85"/>
        <path d="M-17-22h29q9 0 10 9" fill="none" stroke="#d7e8ff" stroke-opacity=".47"/>
        <svg x="-12" y="-12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#bed4ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${icons.branch}</svg>
        <text class="art-label" text-anchor="middle" x="0" y="46">BRANCH</text>
      </g>
    </svg>`;
  }

  function renderHero() {
    const repo = activeRepo;
    const profile = getProfile(repo.profile);
    drawerHero.className = `repo-hero ${profile.color}`;
    drawerHero.innerHTML = `
      ${routeArt(profile)}
      <div class="hero-copy">
        <p class="hero-label">Repositório local</p>
        <h2 id="drawer-title" tabindex="-1">${repo.name}</h2>
        <p class="hero-origin">${repo.owner}/${repo.name}</p>
        <div class="hero-tags">
          <span class="hero-tag">${icon("branch")}<code class="truncate">${repo.branch}</code></span>
          <span class="hero-tag">${avatar(profile)}<span class="truncate">${profile.name}</span></span>
        </div>
      </div>`;
  }

  function identityPoint(label, profile) {
    return `<div class="identity-point">
      <p class="eyebrow">${label}</p>
      <div class="identity-person">${avatar(profile)}<strong>${profile.name}</strong></div>
      <code>${profile.email}</code>
    </div>`;
  }

  function repoDetails(repo) {
    const profile = getProfile(repo.profile);
    const local = getProfile(repo.localProfile || repo.profile);
    const review = needsReview(repo);
    return `<div class="repo-layout">
      <section class="identity" aria-label="Identidade do Git">
        <div class="identity-head"><h3>${icon("shield")}Identidade do Git</h3>${repoStatus(repo, true)}</div>
        <div class="identity-route">
          ${identityPoint("Conta vinculada", profile)}
          <span class="identity-join ${review ? "warning" : ""}" aria-hidden="true">${icon(review ? "alert" : "check")}</span>
          ${identityPoint("Identidade local", local)}
        </div>
        <div class="identity-actions">
          ${review ? '<p class="identity-warning">O nome e o e-mail no Git local diferem da conta vinculada.</p>' : ""}
          ${action("Trocar conta", "users", "edit-profile")}
        </div>
        ${editingProfile ? `<form class="profile-editor" id="profile-editor">
          <label class="sr-only" for="drawer-profile">Nova conta vinculada</label>
          <select id="drawer-profile">${profileOptions(repo.profile)}</select>
          <button type="submit" class="control primary">Aplicar</button>
          ${action("Cancelar", "close", "cancel-profile", "ghost")}
        </form>` : ""}
      </section>
      <section class="drawer-section"><h3>${icon("repo")}Dados do repositório</h3>
        <div class="repo-meta">
          ${metaField("Branch atual", repo.branch, "branch")}
          ${metaField("Pasta local", repoPath(repo), "folder", "copy-path")}
          ${metaField("Remoto", remote(repo), "link", "copy-remote")}
        </div>
      </section>
    </div>`;
  }

  function commits() {
    return `<section class="drawer-section">
      <h3>${icon("history")}Histórico de commits</h3>
      <ul class="commit-list">${history.map((commit, index) => `
        <li style="--entry:${index * 45}ms">${icon("commit")}<div class="commit-text"><strong>${commit.text}</strong><time datetime="${commit.date}">${commit.when}</time></div><code>${commit.hash}</code></li>`
      ).join("")}</ul>
    </section>`;
  }

  const tabs = [
    { id: "details", label: "Visão geral", glyph: "repo" },
    { id: "history", label: "Histórico", glyph: "history" }
  ];

  function renderDrawer() {
    const repo = activeRepo;
    drawerTabs.dataset.tab = activeTab;
    drawerTabs.innerHTML = tabs.map(({ id, label, glyph }) => `
      <button type="button" class="tab" role="tab" id="tab-${id}" data-tab="${id}"
        aria-selected="${id === activeTab}" aria-controls="pane-${id}" tabindex="${id === activeTab ? 0 : -1}">${icon(glyph)}${label}</button>`
    ).join("");
    drawerBody.innerHTML = `
      <div class="drawer-panel" role="tabpanel" id="pane-details" aria-labelledby="tab-details" ${activeTab === "details" ? "" : "hidden"}>${activeTab === "details" ? repoDetails(repo) : ""}</div>
      <div class="drawer-panel" role="tabpanel" id="pane-history" aria-labelledby="tab-history" tabindex="0" ${activeTab === "history" ? "" : "hidden"}>${activeTab === "history" ? commits() : ""}</div>`;
    drawerFooter.innerHTML = `<div class="drawer-footer-inner">
        <div class="left-actions">
          ${action("Finder", "folder", "finder-demo")}
          ${action("Terminal", "terminal", "terminal-demo")}
        </div>
        ${needsReview(repo) ? action("Corrigir identidade", "shield", "fix-identity", "primary") : action("Concluir", "check", "close-drawer", "ghost")}
      </div>`;
  }

  function openRepo(repoName, trigger) {
    const repo = repos.find((item) => item.name === repoName);
    if (!repo) return;
    if (activeRepo !== repo) {
      screen.querySelector('[data-repo][aria-expanded="true"]')?.setAttribute("aria-expanded", "false");
      activeRepo = repo;
      activeTab = "details";
      editingProfile = false;
      drawerFeedback.replaceChildren();
      const previousPage = sections.find((item) => item.id === section).name;
      drawerHead.innerHTML = `<div class="drawer-toolbar">
        <div class="drawer-nav">
          ${action(previousPage, "back", "close-drawer", "ghost")}
          ${icon("chevron")}<span class="caption muted">Detalhes</span>
        </div>
        <div class="drawer-actions">
          ${iconButton("Alternar tema", "sun", "toggle-theme")}
          <button type="button" class="control ghost drawer-close" data-action="close-drawer" aria-label="Fechar detalhes" title="Fechar detalhes (Esc)"><kbd aria-hidden="true">Esc</kbd>${icon("close")}</button>
        </div>
      </div>`;
      drawerHero.style.removeProperty("--glint-x");
      drawerHero.style.removeProperty("--glint-y");
      renderHero();
      renderDrawer();
      applyTheme();
      drawerScroll.scrollTop = 0;
    }
    restoreFocus = trigger;
    trigger.setAttribute("aria-expanded", "true");
    app.setAttribute("data-inspecting", "");
    drawer.inert = false;
    drawerHero.querySelector("h2").focus({ preventScroll: true });
    workspace.inert = true;
  }

  function closeDrawer(returnFocus = drawer.contains(document.activeElement)) {
    if (!activeRepo) return;
    const selected = screen.querySelector('[data-repo][aria-expanded="true"]');
    app.removeAttribute("data-inspecting");
    drawer.inert = true;
    workspace.inert = false;
    drawerFeedback.replaceChildren();
    selected?.setAttribute("aria-expanded", "false");
    if (returnFocus) {
      const target = restoreFocus?.isConnected ? restoreFocus : selected || screen.querySelector(".filter-review") || screen;
      target.focus({ preventScroll: true });
    }
    activeRepo = undefined;
    restoreFocus = undefined;
  }

  function showTab(tab) {
    activeTab = tab;
    editingProfile = false;
    renderDrawer();
    document.querySelector(`#tab-${tab}`).focus({ preventScroll: true });
  }

  function toast(message, glyph = "info", region = feedback) {
    const content = document.createElement("span");
    content.className = "toast";
    content.innerHTML = icon(glyph);
    content.append(document.createTextNode(message));
    region.replaceChildren(content);
    window.clearTimeout(toastTimers.get(region));
    toastTimers.set(region, window.setTimeout(() => region.replaceChildren(), 2900));
  }

  async function copyValue(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const field = document.createElement("textarea");
      field.value = text;
      field.style.cssText = "position:absolute;opacity:0;pointer-events:none";
      const previousFocus = document.activeElement;
      drawer.append(field);
      field.select();
      const copied = document.execCommand("copy");
      field.remove();
      previousFocus?.focus({ preventScroll: true });
      return copied;
    }
    return true;
  }

  function updateIdentity(profileId, message) {
    const scrollTop = screen.scrollTop;
    const profileChanged = activeRepo.profile !== profileId;
    activeRepo.profile = profileId;
    activeRepo.localProfile = profileId;
    editingProfile = false;
    activeTab = "details";
    if (section === "repos") updateRepoList();
    else renderPage();
    screen.scrollTop = scrollTop;
    if (profileChanged) renderHero();
    renderDrawer();
    drawerBody.querySelector(".identity").setAttribute("data-updated", "");
    drawerBody.querySelector('[data-action="edit-profile"]').focus({ preventScroll: true });
    toast(message, "check", drawerFeedback);
  }

  const demoMessages = {
    "link-demo": "No app, esta ação abre o seletor de pastas do macOS.",
    "connect-demo": "No app, esta ação inicia a conexão com o GitHub.",
    "clone-demo": "No app, você escolhe uma pasta para clonar com este perfil.",
    "finder-demo": "No app, esta ação abre a pasta do projeto no Finder.",
    "terminal-demo": "No app, esta ação abre o Terminal na pasta do projeto."
  };

  const actions = {
    "close-drawer": () => closeDrawer(true),
    "toggle-theme": toggleTheme,
    "filter-review": (button) => {
      filters.review = !filters.review;
      button.setAttribute("aria-pressed", String(filters.review));
      updateRepoList();
    },
    "go-review": () => {
      Object.assign(filters, { text: "", profile: "", review: true });
      navigate("repos");
    },
    "edit-profile": () => {
      editingProfile = true;
      renderDrawer();
      document.querySelector("#drawer-profile").focus();
    },
    "cancel-profile": () => {
      editingProfile = false;
      renderDrawer();
      drawerBody.querySelector('[data-action="edit-profile"]').focus();
    },
    "fix-identity": () => updateIdentity(activeRepo.profile, "Identidade local atualizada na prévia."),
    "copy-path": async () => {
      const repo = activeRepo;
      const copied = await copyValue(repoPath(repo));
      toast(copied ? "Pasta local copiada." : "Selecione o caminho para copiá-lo.", copied ? "check" : "info", repo === activeRepo ? drawerFeedback : feedback);
    },
    "copy-remote": async () => {
      const repo = activeRepo;
      const copied = await copyValue(`https://${remote(repo)}.git`);
      toast(copied ? "URL remota copiada." : "Selecione a URL para copiá-la.", copied ? "check" : "info", repo === activeRepo ? drawerFeedback : feedback);
    }
  };

  document.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    const { page, repo, tab, themeChoice, profileFilter, action: name } = button.dataset;
    if (page && page === section && activeRepo) closeDrawer(true);
    else if (page) navigate(page);
    else if (repo) openRepo(repo, button);
    else if (tab) showTab(tab);
    else if (profileFilter) {
      Object.assign(filters, { text: "", profile: profileFilter, review: false });
      navigate("repos");
    } else if (themeChoice) {
      theme = themeChoice;
      applyTheme();
    } else if (actions[name]) actions[name](button);
    else if (demoMessages[name]) toast(demoMessages[name], "info", drawer.contains(button) ? drawerFeedback : feedback);
  });
  themeToggle.addEventListener("click", toggleTheme);
  drawerHero.addEventListener("pointermove", (event) => {
    if (event.pointerType !== "mouse" || reducedMotion.matches) return;
    const { left, top, width, height } = drawerHero.getBoundingClientRect();
    drawerHero.style.setProperty("--glint-x", `${(event.clientX - left) / width * 100}%`);
    drawerHero.style.setProperty("--glint-y", `${(event.clientY - top) / height * 100}%`);
  });
  screen.addEventListener("input", (event) => {
    if (event.target.id !== "repo-search") return;
    filters.text = event.target.value;
    updateRepoList();
  });
  screen.addEventListener("change", (event) => {
    if (event.target.id !== "repo-profile") return;
    filters.profile = event.target.value;
    updateRepoList();
  });
  drawer.addEventListener("submit", (event) => {
    if (event.target.id !== "profile-editor") return;
    event.preventDefault();
    const selected = document.querySelector("#drawer-profile").value;
    updateIdentity(selected, "Conta vinculada e identidade atualizadas na prévia.");
  });
  document.addEventListener("keydown", (event) => {
    const arrowKeys = ["ArrowLeft", "ArrowRight", "Home", "End"];
    if (activeRepo && event.key === "Escape") {
      event.preventDefault();
      closeDrawer();
    } else if (activeRepo && event.target.matches('[role="tab"]') && arrowKeys.includes(event.key)) {
      event.preventDefault();
      const target = event.key === "Home" ? "details" : event.key === "End" ? "history" : activeTab === "details" ? "history" : "details";
      showTab(target);
    } else if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
      event.preventDefault();
      if (section !== "repos") navigate("repos");
      else closeDrawer(false);
      document.querySelector("#repo-search").focus();
    }
  });
  </script>

<script>
(() => {
  const root = document.querySelector("#gitpass");
  const replay = document.querySelector("#gp-splash-replay");
  const template = root.querySelector("#gitpass-splash").cloneNode(true);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  function play(splash, fromReplay) {
    const previous = Array.from(root.children)
      .filter((element) => element !== splash)
      .map((element) => ({element, inert: element.inert}));
    for (const {element} of previous) element.inert = true;
    function done() {
      splash.remove();
      for (const {element, inert} of previous) element.inert = inert;
      if (fromReplay) replay.focus({preventScroll:true});
    }
    if (reduced.matches) {
      window.setTimeout(done, fromReplay ? 500 : 0);
      return;
    }
    window.setTimeout(() => {
      splash.dataset.exit = "true";
      window.setTimeout(done, 240);
    }, 1380);
  }
  play(root.querySelector("#gitpass-splash"), false);
  replay.addEventListener("click", () => {
    if (root.querySelector("#gitpass-splash")) return;
    const splash = template.cloneNode(true);
    root.prepend(splash);
    play(splash, true);
  });
})();
</script>
</body>
