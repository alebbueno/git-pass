<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>GitPass</title>
    <script>
      // Aplica o tema antes do primeiro desenho (sem piscar escuro → claro).
      try {
        var t = localStorage.getItem("gitpass-theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <style>
      /* Estado antes do bundle: canvas e texto do design system (os tokens ainda não carregaram). */
      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: #f4f5fb;
        color: #18192e;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0e1120;
        color: #f1f2ff;
      }
      .shell-loading {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        color: #565c74;
        font-size: 13px;
      }
      html[data-theme="dark"] .shell-loading {
        color: #b7bdd6;
      }
      .shell-loading-inner {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .shell-loading-spinner {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid #dce0ed;
        border-top-color: #5138c9;
        animation: boot-spin 0.85s linear infinite;
      }
      html[data-theme="dark"] .shell-loading-spinner {
        border-color: #2d3550;
        border-top-color: #beb0ff;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .shell-loading-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="shell-loading" role="status" aria-live="polite">
        <div class="shell-loading-inner">
          <span class="shell-loading-spinner" aria-hidden="true"></span>
          <p style="margin: 0">Carregando o GitPass…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
