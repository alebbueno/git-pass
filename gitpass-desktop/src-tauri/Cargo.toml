[package]
name = "gitpass-desktop"
version = "0.1.0"
description = "GitPass desktop (Tauri)"
authors = ["GitPass contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }
png = "0.17"

[dependencies]
tauri = { version = "2.2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
opener = "0.7"
gitpass-core = { path = "../../crates/gitpass-core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
